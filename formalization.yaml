# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Lean proofs of the statements of Grothendieck's working notes (Hexagon 2611.00125)"
  description: >-
    The Lean 4 proofs of the paper « Grothendieck Montpellier. Énoncés des lectures modernisées
    démontrés. » (Hexagon 2611.00125): statements read in the working notes of
    Alexandre Grothendieck kept at the University of Montpellier, one file per folder, in
    algebraic geometry, commutative algebra, category and topos theory, homotopy theory,
    combinatorics and geometry, with the general lemmas they need. The compared Challenge has
    one headline theorem per proof file for 41 of the 91 files (Palomar limits the Challenge file
    to 1,000 lines and 100 KiB; CHALLENGE.md lists all 91 and the 50 not compared, which are
    proved in the library), among them the bigon-free dichotomy for combinatorial pseudoline
    arrangements (folder 80, page 24).
  authors:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"

classification:
  arxiv: ["math.AG", "math.CT", "math.AC", "math.CO", "math.HO"]
  msc2020: ["03B35", "14-03", "18-03", "52C30", "01A60"]

sources:
  - title: "Grothendieck Montpellier. Énoncés des lectures modernisées démontrés."
    authors:
      - "Michel Hua"
    id: "https://hexagonmath.org/2611.00125v1"
    type: "preprint"
    location: "https://hexagonmath.org/2611.00125v1"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Working notes of Alexandre Grothendieck (University of Montpellier); the Challenge takes one statement per folder file"
    authors:
      - "Alexandre Grothendieck"
    id: "https://grothendieck.umontpellier.fr/"
    type: "manuscript"
    location: "https://grothendieck.umontpellier.fr/"
    relationship: "independently-proves"
    note: "The folders state the results; the proofs are the paper's. CHALLENGE.md gives, for each Challenge statement, the folder, the page and the section of the paper."
    license: "unknown"
    author_endorsement: "n/a"
status:
  scope: >-
    The library holds the Lean proofs of the Hexagon paper 2611.00125, one file per folder of the
    working notes, and the general lemmas they use (Grothendieck/Upstream). The Challenge states
    one headline theorem per proof file for 41 of the 91 files (the other 50 are built and proved,
    not compared, because Palomar limits the Challenge file, and only it, to 1,000 lines and
    100 KiB); Folder18 is left out because it states a
    conjecture as a definition and proves no theorem. 23 statements are representative choices
    where the paper has no single proved theorem for a folder (CHALLENGE.md). Definitions the
    statements depend on are copied verbatim and compared by type. All proofs are complete.
    Statements the paper reports without a Lean check are not in the library.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "Claude Code with the Lean language server, on Lean 4 and Mathlib; the proof was written by the model and checked by Lean."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: "The statement and the proof strategy were set by the author; the Lean text was written by a language model under his direction and kept only once Lean accepted it."

fidelity:
  divergences: "Pseudoline arrangements are replaced by their combinatorial maps, with axioms weaker than the page's; the numbering lemma of page 28 is not formalised."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The statements are those of the paper; the bigon-free dichotomy was compared with the page by the author, the others were not each re-read against the pages. No independent mathematical review."

