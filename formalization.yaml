# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A bigon-free dichotomy for pseudoline arrangements: Lean proof (Grothendieck, folder 80)"
  description: >-
    The Lean 4 proof of the theorem cited by the article « A bigon-free dichotomy for pseudoline
    arrangements, after a note of Grothendieck » (submitted to Hexagon on 7 November 2026), from
    the Lean appendix of the Hexagon paper 2611.00125: every bigon-free combinatorial
    arrangement of pseudolines in the real projective plane is four lines in general position
    or contains five lines in general position, a pencil of three and a pencil of two in which
    none of these five lines joins the two centres, or the complete quadrangle (folder 80 of
    Grothendieck's working notes, pages 20 and 24).
  authors:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"

classification:
  arxiv: ["math.CO"]
  msc2020: ["52C30", "52C40", "05C10", "03B35"]

sources:
  - title: "Grothendieck Montpellier. Énoncés des lectures modernisées démontrés."
    authors:
      - "Michel Hua"
    id: "https://hexagonmath.org/2611.00125v1"
    type: "preprint"
    location: "https://hexagonmath.org/2611.00125v1"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"
    note: "The theorem belongs to its Lean appendix; the article « A bigon-free dichotomy for pseudoline arrangements, after a note of Grothendieck », submitted to Hexagon on 7 November 2026, cites it."
  - title: "Working notes of Alexandre Grothendieck (University of Montpellier); the Challenge is from folder 80, pages 20, 24 and 28"
    authors:
      - "Alexandre Grothendieck"
    id: "https://grothendieck.umontpellier.fr/"
    type: "manuscript"
    location: "https://grothendieck.umontpellier.fr/"
    relationship: "independently-proves"
    note: "The folders state the results; the proofs are the paper's. For the Challenge, page 24 of folder 80 states the dichotomy in a box, and the proof is not the page's."
    license: "unknown"
    author_endorsement: "n/a"
status:
  scope: >-
    The Challenge states the boxed dichotomy of page 24 of folder 80 for combinatorial pseudoline
    arrangements, defined as generalised maps with flags labelled by lines; the proof is complete.
    The map axioms are weaker than the page's (going straight through a vertex is not assumed),
    so the theorem is stronger than the page's. The other files of the library (the other proofs
    of the Hexagon paper 2611.00125) are built with it but not compared here. Not formalised: the
    numbering lemma of page 28, the ordering and the near-pencil corollary of the article, and
    the passage from a topological arrangement to its map.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "Claude Code with the Lean language server, on Lean 4 and Mathlib; the proof was written by the model and checked by Lean."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: "The statement and the proof strategy were set by the author; the Lean text was written by a language model under his direction and kept only once Lean accepted it."

fidelity:
  divergences: "Pseudoline arrangements are replaced by their combinatorial maps, with axioms weaker than the page's; the numbering lemma of page 28 is not formalised."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The statement was compared with the page by the author. No independent mathematical review."

alignment:
  namespace: "Grothendieck.Folder80Maps2"
  statements:
    - source: "Folder 80, page 24 (boxed statement)"
      lean: "Grothendieck.Folder80Maps2.PseudolineMap.map_dichotomy"
      module: "Grothendieck.Folder80Maps2"
      status: "proved"
      note: "Stated for generalised maps with flags labelled by lines, with weaker axioms than the page's."

acknowledgements: "Lean 4, Mathlib, and the Palomar template."
