# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The tangent line at a marked point on M_{0,n}: Lean proofs (Grothendieck, folder 146)"
  description: >-
    The Lean 4 proofs of the two theorems cited by the article « The tangent line at a marked
    point on M_{0,n}/S_{n-1}, after a table of Grothendieck » (submitted to Hexagon on
    7 November 2026), from the Lean appendix of the Hexagon paper 2611.00125. In a homogeneous
    model of M_{0,n} (configurations of vectors of K², functions of weight), over a field with
    the relevant primitive roots of unity, L = L_1 ⊗ … ⊗ L_n has order n − 1 for the action of
    S_n (trivL_iff) and the tangent line L_n at the last marked point has order (n − 1)(n − 2)
    for the action of S_{n−1} (trivLi_iff), for every n. The question comes from the table of
    page 70 of folder 146 of Grothendieck's working notes.
  authors:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"

classification:
  arxiv: ["math.AG"]
  msc2020: ["14H10", "14C22", "14D23", "03B35"]

sources:
  - title: "Grothendieck Montpellier. Énoncés des lectures modernisées démontrés."
    authors:
      - "Michel Hua"
    id: "https://hexagonmath.org/2611.00125v1"
    type: "preprint"
    location: "https://hexagonmath.org/2611.00125v1"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"
    note: "The two theorems belong to its Lean appendix; the article « The tangent line at a marked point on M_{0,n}/S_{n-1}, after a table of Grothendieck », submitted to Hexagon on 7 November 2026, cites them."
  - title: "Working notes of Alexandre Grothendieck (University of Montpellier), folder 146, page 70"
    authors:
      - "Alexandre Grothendieck"
    id: "https://grothendieck.umontpellier.fr/"
    type: "manuscript"
    location: "https://grothendieck.umontpellier.fr/"
    relationship: "independently-proves"
    note: "The table of page 70 gives the orders 3 for L and 6 for L_i for four points, and only guesses for five and six; the general formula and its proofs are the paper's."
    license: "unknown"
    author_endorsement: "n/a"
status:
  scope: >-
    The Challenge states trivL_iff and trivLi_iff of Grothendieck/Folder146.lean, for every n,
    over any field with the relevant primitive roots of unity, the trivialising function being
    any function on the configurations over that field; both proofs are complete. The other files
    of the library (the other proofs of the Hexagon paper 2611.00125) are built with them but not
    compared here. Not formalised: the dictionary between equivariant line bundles on M_{0,n} and
    functions of weight, that is, the identification of the equivariant Picard group with the
    first cohomology of the symmetric group with values in the units.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "Claude Code with the Lean language server, on Lean 4 and Mathlib; the proof was written by the model and checked by Lean."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: "The statement and the proof strategy were set by the author; the Lean text was written by a language model under his direction and kept only once Lean accepted it."

fidelity:
  divergences: "Equivariant line bundles on M_{0,n} are replaced by functions of weight on configurations of vectors of K², not required to be regular; the identification with the equivariant Picard group is not formalised."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The statements were compared with the article by the author. No independent mathematical review."

alignment:
  namespace: "Grothendieck.Folder146"
  statements:
    - source: "Folder 146, page 70 (column for L); article, Theorem 1 (2)"
      lean: "Grothendieck.Folder146.trivL_iff"
      module: "Grothendieck.Folder146"
      status: "proved"
      note: "Stated in the homogeneous model, for every n ≥ 2, over a field with a primitive (n − 1)-th root of unity."
    - source: "Folder 146, page 70 (column for L_i); article, Theorem 1 (1)"
      lean: "Grothendieck.Folder146.trivLi_iff"
      module: "Grothendieck.Folder146"
      status: "proved"
      note: "Stated in the homogeneous model, for every n ≥ 3, over a field with primitive roots of unity of orders n − 1 and n − 2."

acknowledgements: "Lean 4, Mathlib, and the Palomar template."
