# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Lean proofs of the statements of Grothendieck's working notes (Hexagon 2611.00125)"
  description: >-
    The Lean 4 proofs of the paper « Énoncés des notes de travail de Grothendieck démontrés en
    Lean 4, et questions ouvertes » (Hexagon 2611.00125): statements read in the working notes of
    Alexandre Grothendieck kept at the University of Montpellier, one file per folder, in
    algebraic geometry, commutative algebra, category and topos theory, homotopy theory,
    combinatorics and geometry, with the general lemmas they need. The compared Challenge is
    one headline statement of the paper, the bigon-free dichotomy for combinatorial pseudoline
    arrangements (folder 80, page 24); the whole library is built and checked with it.
  authors:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Michel Hua"
      orcid: "0009-0002-8304-0683"

classification:
  arxiv: ["math.AG", "math.CT", "math.AC", "math.CO", "math.HO"]
  msc2020: ["03B35", "14-03", "18-03", "52C30", "01A60"]

sources:
  - title: "Énoncés des notes de travail de Grothendieck démontrés en Lean 4, et questions ouvertes"
    authors:
      - "Michel Hua"
    id: "https://hexagonmath.org/2611.00125v1"
    type: "preprint"
    location: "https://hexagonmath.org/2611.00125v1"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Working notes of Alexandre Grothendieck (University of Montpellier); the Challenge is from folder 80, pages 20, 24 and 28"
    authors:
      - "Alexandre Grothendieck"
    id: "https://grothendieck.umontpellier.fr/"
    type: "manuscript"
    location: "https://grothendieck.umontpellier.fr/"
    relationship: "independently-proves"
    note: "The folders state the results; the proofs are the paper's. For the Challenge, page 24 of folder 80 states the dichotomy in a box, and the proof is not the page's."
    license: "unknown"
    author_endorsement: "n/a"
status:
  scope: >-
    The library holds the Lean proofs of the Hexagon paper 2611.00125, one file per folder of the
    working notes, and the general lemmas they use (Grothendieck/Upstream). The Challenge states the boxed dichotomy of page 24 for combinatorial pseudoline
    arrangements, defined as generalised maps with flags labelled by lines; the proof is complete.
    The map axioms are weaker than the page's (going straight through a vertex is not assumed),
    so the theorem is stronger than the page's. Not formalised: the numbering lemma of page 28
    and the passage from a topological arrangement to its map.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: "Claude Code with the Lean language server, on Lean 4 and Mathlib; the proof was written by the model and checked by Lean."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: "The statement and the proof strategy were set by the author; the Lean text was written by a language model under his direction and kept only once Lean accepted it."

fidelity:
  divergences: "Pseudoline arrangements are replaced by their combinatorial maps, with axioms weaker than the page's; the numbering lemma of page 28 is not formalised."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "The statement was compared with the page by the author. No independent mathematical review."

alignment:
  namespace: "Grothendieck.Folder80Maps2"
  statements:
    - source: "Folder 80, page 24 (boxed statement)"
      lean: "Grothendieck.Folder80Maps2.PseudolineMap.map_dichotomy"
      module: "Grothendieck.Folder80Maps2"
      status: "proved"
      note: "Stated for generalised maps with flags labelled by lines, with weaker axioms than the page's."

acknowledgements: "Lean 4, Mathlib, and the Palomar template."
