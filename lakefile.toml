name = "BigonFreeDichotomy"
version = "0.1.0"
defaultTargets = ["Grothendieck", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "715a03a90adf491de40fbec8b456c179a623435f"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]


[[lean_lib]]
name = "Grothendieck"
globs = ["Grothendieck.+"]

# Vendored files of AxiomMath/Stacks (Apache-2.0), kept at their upstream module paths under
# Stacks/; see Stacks/NOTICE.md. Their options are Stacks' own, and their warnings are not errors.
[[lean_lib]]
name = "StacksCore"
srcDir = "Stacks"
globs = ["StacksCore.+"]
leanOptions = { warningAsError = false, autoImplicit = false, relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }

[[lean_lib]]
name = "StacksFrontier"
srcDir = "Stacks"
globs = ["StacksFrontier.+"]
leanOptions = { warningAsError = false, autoImplicit = false, relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }
