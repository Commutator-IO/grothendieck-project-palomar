name = "BigonFreeDichotomy"
version = "0.1.0"
defaultTargets = ["Grothendieck", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "715a03a90adf491de40fbec8b456c179a623435f"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
globs = ["Challenge", "Challenge.+"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]


[[lean_lib]]
name = "Grothendieck"
globs = ["Grothendieck.+"]
